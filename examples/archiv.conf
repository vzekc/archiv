# Einstellungen des Archivs: Schlüssel = Wert, eine Einstellung je Zeile.
# Gesucht wird die Datei unter $ARCHIV_HOME/data/archiv.conf; ein anderer
# Ort geht mit "archiv serve -config <datei>".

# Adresse, unter der das Archiv erreichbar ist (für Links in Nachrichten)
site_url = http://localhost:8095
# Name und Zeile im Seitenkopf; ohne site_title steht dort der Hostname
site_title = Unser Archiv
site_tagline = Handbücher, Disketten und Fotos
# So nennt das Sprachmodell das Archiv in seinen Anweisungen
archive_name = Archiv der Familie Müller

# Anmeldung:
#   local   das Archiv verwaltet die Konten selbst (Rollen Leser, Einreicher,
#           Archivar); das erste Konto entsteht über den Einrichtungslink,
#           den der Dienst beim ersten Start ins Protokoll schreibt
#   header  ein Proxy davor meldet an (z. B. Apache mit mod_auth_openidc) und
#           gibt Kennung, Namen, E-Mail und Gruppen als Kopfzeilen weiter
auth = local
# Besucher ohne Konto dürfen lesen
open_read = off
# bei auth = header (die Werte hier sind die Vorgaben):
# user_header = OIDC_CLAIM_sub
# name_header = OIDC_CLAIM_preferred_username
# email_header = OIDC_CLAIM_email
# groups_header = OIDC_CLAIM_groups
# moderator_group = Moderatoren

# Eigene Einreichungen von Archivaren direkt zur Aufnahme vorlegen
# (direct) oder über die Liste der Moderation laufen lassen (moderated)
intake = direct

# Katalog im Browser bearbeiten
editing = on

# Vorschläge eines Sprachmodells (ohne llm gibt es keine):
#   llm = openai     jeder Dienst mit OpenAI-kompatibler Schnittstelle,
#                    auch lokale Modelle über Ollama oder LM Studio
#   llm = anthropic
# llm =
# llm_model =
# llm_key_file = /archiv/data/llm.key
# für ein lokales Modell über Ollama auf dem Rechner, der Docker ausführt:
# llm_url = http://host.docker.internal:11434/v1

# E-Mail-Benachrichtigungen; ohne Mailserver gibt es nur die Nachrichten
# im Archiv
# smtp_host = mail.example.org
# smtp_port = 587
# smtp_user = archiv@example.org
# smtp_password_file = /archiv/data/smtp.pass
# mail_from = archiv@example.org

# Grenzen für Einreichungen (GB)
# max_file_gb = 20
# max_submission_gb = 50
# max_pending_gb = 100
