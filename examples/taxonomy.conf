# Feste Schlagworte des Katalogs ("archiv sync" liest die Datei).
#
# [facette], darunter ein Schlagwort je Zeile, je Ebene zwei Leerzeichen
# eingerückt. Nach dem Namen und mindestens zwei Leerzeichen:
#   section   die Art gehört unter einen Rechner: auf der Seite eines
#             Rechners erscheinen die Objekte nach diesen Arten geordnet
#   sort=N    Reihenfolge der Abschnitte; kleinere Zahlen stehen oben
# Rechner: Hersteller > Serie > Modell; eine Ebene darf fehlen.
#
# Ein Anfang zum Anpassen. Neue Schlagworte entstehen auch beim Arbeiten im
# Archiv; diese Datei legt die fest, die immer da sein sollen.

[kind]
Hersteller-Dokumentation   section sort=10
Sekundärliteratur          section sort=20
Firmware / EPROM-Images    section sort=30
Betriebssysteme            section sort=40
Programmiersprachen und Entwicklungswerkzeuge   section sort=45
Anwendungsprogramme        section sort=50
Spiele                     section sort=60
Fotos                      section sort=70
Zeitschrift                sort=1
Buch                       sort=25
Werbung                    sort=85
Begleittext                sort=99

[language]
de
en

[machine]
Commodore
  C64
  Amiga
Apple
  Apple II
  Macintosh
